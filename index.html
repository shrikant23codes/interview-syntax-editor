<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyntaxAid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="editor"></div>
  <div id="status-bar">
    <span id="status-dot"></span>
    <span id="status-text">Checking Ollama...</span>
    <button id="retry-btn" class="hidden">Retry</button>
    <button id="settings-btn">Settings</button>
    <div id="status-details" class="hidden"></div>
  </div>
  <div id="settings-panel" class="hidden">
    <h3>Settings</h3>
    <label>Ollama Host</label>
    <input type="text" id="host-input" />
    <label>Model Name</label>
    <input type="text" id="model-input" />
    <button id="save-settings">Save</button>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
